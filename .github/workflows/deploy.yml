name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v7
        with:
          repository: eylulg/ui
          path: ui-src
      - name: Build @eylulg/ui
        # package.json depends on file:../ui. Checkout cannot write outside the workspace,
        # so the library is checked out here and moved up a level.
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build
      # install-links copies the library in, as the local relink does. A symlink would give
      # TypeScript two copies of the React types. npm ci cannot be used: the lockfile records a link.
      - name: Install the app against the built library
        run: npm install --no-audit --no-fund --install-links
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
