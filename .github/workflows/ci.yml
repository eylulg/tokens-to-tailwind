name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v7
        with:
          repository: eylulg/ui
          path: ui-src
      - name: Build @eylulg/ui
        # package.json depends on file:../ui. Checkout cannot write outside the workspace,
        # so the library is checked out here and moved up a level.
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build
      # install-links copies the library in, as the local relink does. A symlink would give
      # TypeScript two copies of the React types. npm ci cannot be used: the lockfile records a link.
      - name: Install the app against the built library
        run: npm install --no-audit --no-fund --install-links
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
